<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:scriptfree="http://jakarta.apache.org/taglibs/standard/scriptfree"
	xmlns:permittedTaglibs="http://jakarta.apache.org/taglibs/standard/permittedTaglibs"
	xmlns:sql="http://java.sun.com/jsp/jstl/sql"
	xmlns:fmt="http://java.sun.com/jsp/jstl/fmt"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core_1_1"
	xmlns:x="http://java.sun.com/jsp/jstl/xml"
	xmlns:p="http://primefaces.org/ui">

<h:head></h:head>
<body>
	<ui:composition template="/shared/layout.xhtml">
		<ui:define name="links">
			<link href="${homeBean.URLWithContextPath}/resources/css/thread.css"
				rel="stylesheet" type="text/css" />
		</ui:define>
		<ui:define name="header">
			
		</ui:define>
		<ui:define name="content">

			<p:panel id="basic" header="#{threadBean.currentThread.subject}"
				style="margin-bottom:20px">
				<h:panelGrid columns="2" style="width:auto"
					columnClasses="logo,detail">
					<p:outputPanel styleClass="postUser">
						<h:outputLink
							value="#{homeBean.URLWithContextPath}/user.xhtml?id=#{threadBean.currentThread.userAccount.id}">
							<h:outputText
								value="#{threadBean.currentThread.userAccount.username}"
								styleClass="postUsername">
							</h:outputText>
						</h:outputLink>
						<br />
						<p:graphicImage
							url="#{homeBean.URLWithContextPath}/resources/images/man-no.png"
							height="120px" width="120px" />
					</p:outputPanel>
					<p:outputPanel>
						<h:outputText value="#{threadBean.currentThread.content}"
							escape="false" />
					</p:outputPanel>

					<!-- 							<p:commandLink update=":form:carDetail"
								oncomplete="PF('carDialog').show()" title="View Detail">
								<h:outputText styleClass="ui-icon pi pi-search"
									style="margin:0 auto;" />
								<f:setPropertyActionListener value="#{car}"
									target="#{dataGridView.selectedCar}" />
							</p:commandLink> -->
				</h:panelGrid>
			</p:panel>
			<!-- <p:dataList value="#{threadBean.approvedPosts}" var="post"
				type="unordered" itemType="none" paginator="true"
				paginatorPosition="bottom" rows="10" styleClass="paginated">

				<p:panel id="post-#{post.id}" header="#{post.subject}"
					style="margin-bottom:20px">
					<h:panelGrid columns="2" cellpadding="10">
						<p:graphicImage
							url="#{homeBean.URLWithContextPath}/resources/images/man-no.png" />
						<h:outputText value="#{post.contents}" escape="false" />
					</h:panelGrid>
				</p:panel>

			</p:dataList> -->

			<h:form id="form">
				<p:dataView var="post" value="#{threadBean.approvedPosts}" rows="10"
					paginator="true" rowsPerPageTemplate="5,10,15"
					paginatorPosition="bottom"
					paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
					layout="list" paginatorAlwaysVisible="false">

					<p:dataViewListItem>
						<h:panelGrid columns="2" style="width:auto"
							columnClasses="logo,detail">
							<p:outputPanel styleClass="postUser">
								<h:outputLink
									value="#{homeBean.URLWithContextPath}/user.xhtml?id=#{post.userAccount.id}">
									<h:outputText value="#{post.userAccount.username}"
										styleClass="postUsername">
									</h:outputText>
								</h:outputLink>
								<br />
								<p:graphicImage
									url="#{homeBean.URLWithContextPath}/resources/images/man-no.png"
									height="120px" width="120px" />
							</p:outputPanel>
							<p:outputPanel>
								<h:outputText value="#{post.contents}" escape="false" />
							</p:outputPanel>

							<!-- 							<p:commandLink update=":form:carDetail"
								oncomplete="PF('carDialog').show()" title="View Detail">
								<h:outputText styleClass="ui-icon pi pi-search"
									style="margin:0 auto;" />
								<f:setPropertyActionListener value="#{car}"
									target="#{dataGridView.selectedCar}" />
							</p:commandLink> -->
						</h:panelGrid>

					</p:dataViewListItem>
				</p:dataView>
			</h:form>

			<br />
			<h:form>
				<p:textEditor value="${threadBean.postText}" styleClass="post-editor">
				</p:textEditor>
				<p:remoteCommand name="rc" update="msgs"
					action="#{threadBean.showMessage}" />

				<p:growl id="msgs" showDetail="true" />
				<p:commandButton type="button" onclick="rc()" value="Execute"
					icon="pi pi-refresh" />
			</h:form>

		</ui:define>
	</ui:composition>
</body>
</html>
