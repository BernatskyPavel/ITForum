	<div class="ui-g">
		<div class="ui-lg-12 ui-md-6 ui-lg-3 ui-g-nopad" id="header-parent">
			<h:panelGroup id="headerPanel">
				<div id="header" class="ui-g">
					<div class="ui-lg-4 ui-g-nopad">
						<h:outputLink value="#{homeBean.URLWithContextPath}">
							<h:graphicImage value="/resources/images/logo.png" />
						</h:outputLink>
					</div>
					<div class="ui-lg-8 ui-g-nopad">

						<div class="ui-g" style="height: 100%;">

							<div class="ui-lg-2 ui-g-nopad"></div>
							<div class="ui-lg-2 ui-g-nopad"></div>
							<div class="ui-lg-2 ui-g-nopad"></div>
							<div class="ui-lg-2 ui-g-nopad"></div>
							<div class="ui-lg-2 ui-g-nopad"
								style="margin: auto; text-align: center;">
								<h:form>
									<p:commandButton value="Вход" id="ajax-login"
										actionListener="#{layoutBean.viewLoginForm}"
										styleClass="ui-priority-primary"
										rendered="#{sessionBean.loginStatus == false}">
										<p:ajax event="dialogReturn"
											update=":headerPanel, :contentPanel" />

									</p:commandButton>
									<p:linkButton value="Кабинет" id="cabinet"
										styleClass="ui-priority-primary"
										rendered="#{sessionBean.loginStatus == true}"
										href="${homeBean.URLWithContextPath}/user?id=${sessionBean.user.id}">
									</p:linkButton>
								</h:form>
							</div>
							<div class="ui-lg-2 ui-g-nopad" style="margin: auto;">
								<p:commandButton value="Регистрация" id="signup" action="signup"
									styleClass="ui-priority-primary"
									rendered="#{sessionBean.loginStatus == false}">
								</p:commandButton>
								<p:commandButton value="Выход" id="logout"
									actionListener="#{sessionBean.logout}"
									styleClass="ui-priority-primary"
									rendered="#{sessionBean.loginStatus == true}"
									update=":headerPanel, :contentPanel">
								</p:commandButton>
							</div>
						</div>

					</div>
				</div>
			</h:panelGroup>
		</div>
		<div class="ui-lg-12 ui-md-6 ui-lg-3 ui-g-nopad" style="margin: 2%;">
			<h:panelGroup id="contentPanel">
				<ui:insert name="content">
					<p>Main content</p>
				</ui:insert>
			</h:panelGroup>
		</div>
		<div class="ui-lg-12 ui-md-6 ui-lg-3 ui-g-nopad">
			<div id="footer">
				<ui:insert name="footer">
					<p>Footer</p>
				</ui:insert>
			</div>
		</div>
	</div>
</h:body>
