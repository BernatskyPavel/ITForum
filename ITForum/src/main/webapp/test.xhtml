<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui" 
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">


<h:head>
	<script src="./resources/js/jquery-3.4.0.min.js"></script>	
</h:head>
<body>
	<!-- 	<iframe src="http://localhost:8080/ITForum-0.0.1-SNAPSHOT/resources/other/test.pps" style="width:600px; height:500px;" frameborder="0"></iframe> -->
	<!-- 	<iframe src='https://view.officeapps.live.com/op/embed.aspx?src=http://localhost:8080/ITForum-0.0.1-SNAPSHOT/resources/other/test.pptx' width='100%' height='600px' frameborder='0'/> -->
	<br />
	<h:form prependId="false">
		<p:textEditor widgetVar="editor" value="#{testBean.postText}"
			height="300" styleClass="post-editor" allowBlocks="true"
			allowImages="true" allowLinks="true" allowStyles="true" id="editor">
			<f:facet name="toolbar">
				<span class="ql-formats">
					<button class="ql-bold" />
					<button class="ql-italic" />
					<button class="ql-underline" />
					<button class="ql-strike" />
				</span>
				<span class="ql-formats"> <select class="ql-font" /> <select
					class="ql-size" />
				</span>
				<span class="ql-formats">
					<button class="ql-image" />
					<button class="ql-video" /> <p:commandButton
						onclick="pptconvert()" icon="fa fa-fw fa-file-powerpoint-o"
						type="button" update="editor" />
				</span>
			</f:facet>
		</p:textEditor>

		<p:remoteCommand name="rc" update="msgs"
			action="#{testBean.showMessage}" />

		<br/>
		<pe:ckEditor id="ckeditor" ></pe:ckEditor>
		<p:growl id="msgs" showDetail="true" />
		<p:commandButton type="button" onclick="rc()" value="Execute"
			icon="fa fa-fw fa-edit" />

		<a4j:jsFunction name="pptconvert" action="#{testAjaxBean.ajaxAction}"
			data="#{testAjaxBean}" oncomplete="testUpload(event.data)"
			immediate="true" render="editor">
		</a4j:jsFunction>
		
		<br/>
		<p:button href="./code"></p:button>
	</h:form>
	<script>
	function testUpload(data){
		//var file = $('.rf-fu-inp')[0].files[0];
		var editor = document.querySelector('#editor_editor')
	    editor.__quill.updateContents(editor.__quill.insertEmbed(0, 'html', data.result));
	}
	</script>
</body>
</html>
